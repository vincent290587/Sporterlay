name: Build Windows exe

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Sporterlay
          --collect-all libusb_package --collect-submodules openant --collect-submodules usb --collect-all bleak --collect-submodules winrt
          --add-data "workouts;workouts" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: Sporterlay-windows
          path: dist/Sporterlay.exe
